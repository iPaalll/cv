<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>

  <!-- Geometric stylish avatar icon -->
  <g filter="url(#shadow)">
    <!-- Head -->
    <circle cx="200" cy="155" r="62" fill="url(#avatarGrad)"/>
    <!-- Modern glasses / subtle accent -->
    <rect x="168" y="142" width="26" height="18" rx="5" fill="none" stroke="#1e293b" stroke-width="3.5"/>
    <rect x="206" y="142" width="26" height="18" rx="5" fill="none" stroke="#1e293b" stroke-width="3.5"/>
    <line x1="194" y1="151" x2="206" y2="151" stroke="#1e293b" stroke-width="3.5"/>

    <!-- Smile -->
    <path d="M188 180 Q200 192 212 180" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- Shoulders / Body -->
    <path d="M105 320 C105 255, 145 235, 200 235 C255 235, 295 255, 295 320 C295 340, 275 350, 200 350 C125 350, 105 340, 105 320 Z" fill="url(#avatarGrad)"/>
    
    <!-- Collar / Tie accent in Navy -->
    <path d="M185 235 L200 270 L215 235 Z" fill="#1e3a8a"/>
    <path d="M195 270 L205 270 L208 320 L200 330 L192 320 Z" fill="#0f172a"/>
  </g>

  <!-- Small badge indicator in corner -->
  <circle cx="305" cy="305" r="24" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
  <path d="M296 305 L302 311 L315 298" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
